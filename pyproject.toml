[project]
name = "au-risk-governance-data-platform"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["logs", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "AIR"]
ignore = [
    "S608", # SQL built from module constants (table names), never user input
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["ingestion"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
